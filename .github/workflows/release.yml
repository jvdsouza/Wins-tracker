name: Release

# Triggered by pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Builds the Windows installer and publishes it as a GitHub Release with the
# NSIS installer attached, using electron-builder's built-in GitHub publisher.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run test:unit

      # electron-builder's GitHub publisher races itself when uploading
      # multiple artifacts (the installer + its .blockmap) to a release that
      # doesn't exist yet: both uploads try to create the release at once,
      # one wins and the other 422s on "already_exists", failing the whole
      # step even though the build succeeded. Pre-creating the release here
      # means electron-builder finds it already exists and just uploads.
      - run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run package:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
