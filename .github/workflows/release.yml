name: Release

# Triggered by pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Builds the Windows installer and publishes it as a GitHub Release with the
# NSIS installer attached, using electron-builder's built-in GitHub publisher.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run test:unit

      - run: npm run package:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
