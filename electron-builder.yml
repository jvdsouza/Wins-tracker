appId: com.adhdwins.app
productName: Wins Recorder
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  target: nsis
  # mac/linux targets are intentionally omitted for v1 — adding them later
  # is a config-only change (mac: dmg/zip, linux: AppImage/deb), see
  # docs/superpowers/plans/2026-08-05-adhd-wins-overlay.md Global Constraints.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: jvdsouza
  repo: Wins-tracker
  # electron-builder defaults to publishing a draft that needs a manual
  # click on GitHub before it's public. Auto-publish instead so a tag push
  # alone makes the release available.
  releaseType: release
